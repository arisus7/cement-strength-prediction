# Databricks Asset Bundle: deploys the pipeline as one job (Bronze -> Silver -> Gold -> Train).
#   databricks bundle deploy
#   databricks bundle run medallion_pipeline
bundle:
  name: cement-strength-prediction

variables:
  catalog:
    description: Unity Catalog catalog
    default: datathon
  schema:
    description: Schema for all pipeline tables
    default: gcc

resources:
  jobs:
    medallion_pipeline:
      name: cement-strength-medallion
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/03_gold.py
        - task_key: train
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ./notebooks/04_train.py

targets:
  dev:
    mode: development
    default: true
