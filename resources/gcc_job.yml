resources:
  jobs:
    gcc_pipeline:
      name: "[GCC Datathon] Pipeline Medallon y ML"
      parameters:
        - name: catalog
          default: datathon
        - name: schema
          default: gcc
      tasks:
        - task_key: 00_setup
          notebook_task:
            notebook_path: ../src/00_setup.ipynb
            source: WORKSPACE

        - task_key: 01_bronze
          depends_on:
            - task_key: 00_setup
          notebook_task:
            notebook_path: ../src/01_bronze.py
            source: WORKSPACE

        - task_key: 02_silver
          depends_on:
            - task_key: 01_bronze
          notebook_task:
            notebook_path: ../src/02_silver.py
            source: WORKSPACE

        - task_key: 03_gold
          depends_on:
            - task_key: 02_silver
          notebook_task:
            notebook_path: ../src/03_gold.py
            source: WORKSPACE

        - task_key: 03b_eda_vif
          depends_on:
            - task_key: 03_gold
          libraries:
            - pypi:
                package: statsmodels
          notebook_task:
            notebook_path: ../src/03b_eda_vif.ipynb
            source: WORKSPACE

        - task_key: 04_train
          depends_on:
            - task_key: 03b_eda_vif
          libraries:
            - pypi:
                package: shap
          notebook_task:
            notebook_path: ../src/04_train.py
            source: WORKSPACE